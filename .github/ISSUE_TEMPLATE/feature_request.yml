name: Feature request
description: Suggest an improvement to Notchbee
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the workflow or problem.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help?
      description: What you would like Notchbee to do, and any workaround you use today.
    validations:
      required: true
