name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1
      - name: Core tests
        run: swift test --package-path NotchpilotCore
      - name: Branding check
        run: scripts/check-branding.sh
      - name: Engine privacy check
        run: bun scripts/check-engine-privacy.ts
